services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: sb
      POSTGRES_PASSWORD: sb
      POSTGRES_DB: sb
    ports:
      - "5432:5432"
    volumes:
      - sb_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sb -d sb"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  sb_pgdata:
